[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "2D/3D geometry primitives and utilities (points, lines, vectors, boxes, coordinates)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "units @ git+https://github.com/ry-yoshida-dev/Units.git",
    "rotation @ git+https://github.com/ry-yoshida-dev/Rotation.git",
    "cartesian-axis-3d @ git+https://github.com/ry-yoshida-dev/CartesianAxis3D.git",
    "handedness-rotation @ git+https://github.com/ry-yoshida-dev/HandednessRotation.git",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.40.2",
    "mypy",
    "pytest",
    "ruff>=0.17.3",
    "scipy-stubs",
    "types-shapely",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/Geometry"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/Geometry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geometry = ["py.typed"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
